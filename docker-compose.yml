services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_notes_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./ai-notes-system:/var/www/html
    networks:
      - notes-network
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: ai_notes_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./ai-notes-system:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - notes-network

  mysql:
    image: mysql:8
    container_name: ai_notes_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_notes
      MYSQL_ROOT_PASSWORD: Admin@12345
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - notes-network

networks:
  notes-network:
    driver: bridge

volumes:
  mysql_data: